<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Toolbox">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#58a6ff"/><stop offset=".35" stop-color="#7ee787"/><stop offset=".7" stop-color="#a371f7"/><stop offset="1" stop-color="#f2cc60"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
@keyframes dash{to{stroke-dashoffset:-180}} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1;filter:url(#glow)}} @keyframes flowL{from{transform:translateX(0)}to{transform:translateX(-620px)}} @keyframes flowR{from{transform:translateX(-620px)}to{transform:translateX(0)}} @keyframes wave{0%,100%{transform:translateY(0)}25%{transform:translateY(-12px)}75%{transform:translateY(12px)}} @keyframes fade{0%,20%{opacity:.25}35%,60%{opacity:1}75%,100%{opacity:.25}} @keyframes blink{50%{opacity:0}} @keyframes reveal{0%,15%{opacity:0}25%,100%{opacity:1}}
</style>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#30363d"/>

<text x="58" y="66" class="s" font-size="30" font-weight="760" fill="#f0f6fc">TOOLBOX</text>
<text x="58" y="99" class="m" font-size="14" fill="#8b949e">tools move through the system — not a badge wall</text>
<g transform="translate(45 150)">
 <rect x="0" y="0" width="1110" height="74" rx="18" fill="#0d1117" stroke="#30363d"/>
 <clipPath id="c1"><rect x="18" y="0" width="1074" height="74" rx="14"/></clipPath>
 <g clip-path="url(#c1)" style="animation:flowL 16s linear infinite">
  <g class="m" font-size="14" fill="#c9d1d9">
   <text x="20" y="45">Python</text><text x="120" y="45">PyTorch</text><text x="240" y="45">vLLM</text><text x="330" y="45">Neo4j</text><text x="430" y="45">Qdrant</text><text x="540" y="45">Redis</text><text x="630" y="45">Kafka</text><text x="720" y="45">MongoDB</text><text x="850" y="45">FastAPI</text><text x="970" y="45">Docker</text>
   <text x="1140" y="45">Python</text><text x="1240" y="45">PyTorch</text><text x="1360" y="45">vLLM</text><text x="1450" y="45">Neo4j</text><text x="1550" y="45">Qdrant</text>
  </g>
 </g>
 <rect x="0" y="94" width="1110" height="74" rx="18" fill="#0d1117" stroke="#30363d"/>
 <clipPath id="c2"><rect x="18" y="94" width="1074" height="74" rx="14"/></clipPath>
 <g clip-path="url(#c2)" style="animation:flowR 18s linear infinite">
  <g class="m" font-size="14" fill="#c9d1d9">
   <text x="20" y="139">GraphRAG</text><text x="145" y="139">Agentic AI</text><text x="285" y="139">Embeddings</text><text x="420" y="139">Entity Resolution</text><text x="610" y="139">Hybrid Search</text><text x="765" y="139">WebSockets</text><text x="915" y="139">ONNX Runtime</text>
   <text x="1140" y="139">GraphRAG</text><text x="1265" y="139">Agentic AI</text><text x="1405" y="139">Embeddings</text>
  </g>
 </g>
</g>
<g class="s" font-size="14">
<text x="78" y="352" fill="#58a6ff">AI</text><text x="115" y="352" fill="#c9d1d9">LLMs · RAG · Agents · Evaluation</text>
<text x="465" y="352" fill="#7ee787">GRAPH</text><text x="530" y="352" fill="#c9d1d9">Neo4j · retrieval · identity</text>
<text x="850" y="352" fill="#a371f7">SYSTEMS</text><text x="925" y="352" fill="#c9d1d9">async · queues · reliability</text>
</g>
</svg>