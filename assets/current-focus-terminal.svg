<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Live engineering terminal">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#58a6ff"/><stop offset=".35" stop-color="#7ee787"/><stop offset=".7" stop-color="#a371f7"/><stop offset="1" stop-color="#f2cc60"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
@keyframes dash{to{stroke-dashoffset:-180}} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1;filter:url(#glow)}} @keyframes flowL{from{transform:translateX(0)}to{transform:translateX(-620px)}} @keyframes flowR{from{transform:translateX(-620px)}to{transform:translateX(0)}} @keyframes wave{0%,100%{transform:translateY(0)}25%{transform:translateY(-12px)}75%{transform:translateY(12px)}} @keyframes fade{0%,20%{opacity:.25}35%,60%{opacity:1}75%,100%{opacity:.25}} @keyframes blink{50%{opacity:0}} @keyframes reveal{0%,15%{opacity:0}25%,100%{opacity:1}}
</style>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#30363d"/>

<g transform="translate(48 40)">
 <circle cx="10" cy="10" r="6" fill="#ff7b72"/><circle cx="32" cy="10" r="6" fill="#f2cc60"/><circle cx="54" cy="10" r="6" fill="#7ee787"/>
 <text x="84" y="16" class="m" font-size="14" fill="#8b949e">praveen@ai-systems: ~/current_focus</text>
</g>
<g class="m" font-size="15">
 <text x="58" y="108" fill="#7ee787">$ tail -f engineering.log</text>
 <text x="58" y="150" fill="#58a6ff" style="animation:reveal 8s infinite">[graph]</text><text x="145" y="150" fill="#c9d1d9" style="animation:reveal 8s infinite">preserve identity, evidence, relationships, provenance</text>
 <text x="58" y="190" fill="#7ee787" style="animation:reveal 8s 1.2s infinite">[rag]</text><text x="145" y="190" fill="#c9d1d9" style="animation:reveal 8s 1.2s infinite">retrieve the right context before asking the model to reason</text>
 <text x="58" y="230" fill="#a371f7" style="animation:reveal 8s 2.4s infinite">[agents]</text><text x="145" y="230" fill="#c9d1d9" style="animation:reveal 8s 2.4s infinite">apply tools + policies at the right execution scope</text>
 <text x="58" y="270" fill="#f2cc60" style="animation:reveal 8s 3.6s infinite">[memory]</text><text x="145" y="270" fill="#c9d1d9" style="animation:reveal 8s 3.6s infinite">retain useful context without making every statement permanent</text>
 <text x="58" y="310" fill="#ff7b72" style="animation:reveal 8s 4.8s infinite">[prod]</text><text x="145" y="310" fill="#c9d1d9" style="animation:reveal 8s 4.8s infinite">design for limits, partial failure, retries and observability</text>
 <text x="58" y="365" fill="#8b949e">status:</text><text x="125" y="365" fill="#7ee787">building</text><text x="195" y="365" fill="#58a6ff" style="animation:blink 1s steps(2,end) infinite">_</text>
</g>
</svg>