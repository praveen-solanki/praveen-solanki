<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Flagship projects">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#58a6ff"/><stop offset=".35" stop-color="#7ee787"/><stop offset=".7" stop-color="#a371f7"/><stop offset="1" stop-color="#f2cc60"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
@keyframes dash{to{stroke-dashoffset:-180}} @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1;filter:url(#glow)}} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}} @keyframes fade{0%,20%{opacity:.25}35%,60%{opacity:1}75%,100%{opacity:.25}} @keyframes sweep{from{transform:translateX(-400px)}to{transform:translateX(1600px)}} @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-620px)}} @keyframes blink{50%{opacity:0}}
</style>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#30363d"/>

<text x="58" y="66" class="s" font-size="30" font-weight="760" fill="#f0f6fc">FLAGSHIP PROJECTS</text>
<text x="58" y="99" class="m" font-size="14" fill="#8b949e">four systems · four different engineering strengths</text>
<g transform="translate(56 145)">
 <g style="animation:fade 12s ease-in-out infinite"><rect x="0" y="0" width="260" height="190" rx="20" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/><text x="22" y="36" class="m" font-size="12" fill="#58a6ff">01 / AGENTIC</text><text x="22" y="72" class="s" font-size="18" font-weight="700" fill="#f0f6fc">AgenticMindGraph.ai</text><text x="22" y="102" class="s" font-size="14" fill="#c9d1d9">knowledge evolution</text><text x="22" y="126" class="s" font-size="14" fill="#c9d1d9">multi-agent reasoning</text><text x="22" y="160" class="m" font-size="12" fill="#8b949e">Neo4j · vLLM · BGE-M3</text></g>
 <g style="animation:fade 12s ease-in-out 3s infinite"><rect x="286" y="0" width="260" height="190" rx="20" fill="#0d1117" stroke="#7ee787" stroke-width="2"/><text x="308" y="36" class="m" font-size="12" fill="#7ee787">02 / RAG</text><text x="308" y="72" class="s" font-size="18" font-weight="700" fill="#f0f6fc">RAG Full Pipeline</text><text x="308" y="102" class="s" font-size="14" fill="#c9d1d9">hybrid vs vectorless</text><text x="308" y="126" class="s" font-size="14" fill="#c9d1d9">benchmark + evaluation</text><text x="308" y="160" class="m" font-size="12" fill="#8b949e">Qdrant · RAGAS · RRF</text></g>
 <g style="animation:fade 12s ease-in-out 6s infinite"><rect x="572" y="0" width="260" height="190" rx="20" fill="#0d1117" stroke="#a371f7" stroke-width="2"/><text x="594" y="36" class="m" font-size="12" fill="#a371f7">03 / VISION</text><text x="594" y="72" class="s" font-size="18" font-weight="700" fill="#f0f6fc">ADAS Perception</text><text x="594" y="102" class="s" font-size="14" fill="#c9d1d9">185.5 FPS ONNX GPU</text><text x="594" y="126" class="s" font-size="14" fill="#c9d1d9">97.82% sign accuracy</text><text x="594" y="160" class="m" font-size="12" fill="#8b949e">YOLO · ResNet · ONNX</text></g>
 <g style="animation:fade 12s ease-in-out 9s infinite"><rect x="858" y="0" width="260" height="190" rx="20" fill="#0d1117" stroke="#f2cc60" stroke-width="2"/><text x="880" y="36" class="m" font-size="12" fill="#f2cc60">04 / TRACE</text><text x="880" y="72" class="s" font-size="18" font-weight="700" fill="#f0f6fc">TestForge.ai</text><text x="880" y="102" class="s" font-size="14" fill="#c9d1d9">requirements ↔ code</text><text x="880" y="126" class="s" font-size="14" fill="#c9d1d9">impact + drift analysis</text><text x="880" y="160" class="m" font-size="12" fill="#8b949e">Neo4j · FastAPI · React</text></g>
</g>
<text x="600" y="378" text-anchor="middle" class="m" font-size="13" fill="#8b949e">spotlight cycles across the four projects</text>
</svg>